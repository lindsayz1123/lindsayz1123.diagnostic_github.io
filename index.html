<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Learning Diagnostic</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Learning Diagnostic</h1>
        <p>Learn what you need. Skip what you already know.</p>
    </header>

    <main>

        <!-- START SCREEN -->
        <section id="startScreen">

            <h2>What do you want to learn?</h2>

            <p>
                Enter a subject to create a personalized learning path.
            </p>

            <input
                type="text"
                id="topic"
                placeholder="Example: Java"
            >

            <button id="continueButton">
                Continue
            </button>

        </section>


        <!-- QUIZ SCREEN -->
        <section id="quizScreen" class="hidden">

            <h3 id="unitName"></h3>

            <p id="difficulty"></p>

            <!-- Question text AND code box go inside here -->
            <div id="questionText"></div>

            <div id="answerChoices"></div>

            <button id="submitButton">
                Submit Answer
            </button>

        </section>


        <!-- RESULTS SCREEN -->
        <section id="resultsScreen" class="hidden">

            <h2>Your Java Mastery</h2>

            <p>
                These results will be used to personalize your learning path.
            </p>

            <div id="masteryResults"></div>

        </section>

    </main>


    <!-- Question bank must load first -->
    <script src="questions.js"></script>

    <!-- Diagnostic logic loads second -->
    <script src="script.js"></script>

</body>

</html>
