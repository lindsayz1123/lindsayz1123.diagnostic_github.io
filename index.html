<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Diagnostic</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Learning Diagnostic</h1>
        <p>Learn what you need. Skip what you already know.</p>
    </header>

    <main>

        <!-- START SCREEN -->
        <section id="startScreen">
            <h2>What do you want to learn?</h2>

            <p>
                Enter a subject to create a personalized learning path.
            </p>

            <input
                type="text"
                id="topic"
                placeholder="Example: Java"
            >

            <button id="continueButton">
                Continue
            </button>
        </section>


        <!-- DIAGNOSTIC SCREEN -->
        <section id="quizScreen" class="hidden">

            <p id="unitName"></p>
            <p id="difficulty"></p>

            <h2 id="questionText"></h2>

            <div id="answerChoices"></div>

            <button id="submitButton">
                Submit Answer
            </button>

        </section>


        <!-- FINAL RESULTS SCREEN -->
        <section id="resultsScreen" class="hidden">

            <h2>Your Mastery Results</h2>

            <p>
                Your diagnostic is complete. These results will be used
                to create your personalized learning path.
            </p>

            <div id="masteryResults"></div>

        </section>

    </main>


    <!-- Question bank -->
    <script src="questions.js"></script>

    <!-- Diagnostic functionality -->
    <script src="script.js"></script>

</body>

</html>
